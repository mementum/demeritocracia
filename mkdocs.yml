site_name: Demeritocracia
# site_url: https://demeritocracia.de
site_author: Daniel Rodriguez
site_description: Una colección de deméritos políticos en la democracia española
copyright: Copyright &copy; 2026 Daniel Rodriguez

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  # custom_dir: website/assets/overrides
  # favicon: assets/base_images/favicon.png
  # logo: assets/base_images/favicon.png

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

  # font:
  #  text: 'Inter'
  #  code: 'Hack'

  features:
    - content.code.copy
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - toc.follow
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true

  - pymdownx.blocks.admonition
  - pymdownx.blocks.html
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.escapeall:
      hardbreak: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
  - blog:
      blog_dir: blog
      blog_toc: true
      post_dir: blog/posts
      post_date_format: medium
      post_url_format: "{date}/{slug}"
      authors: true
      categories: true
      # categories_allowed:
      #  - General
      #  - Software Engineering
      #  - Data Science
      # post_excerpt: required
      # post_excerpt_separator: <!-- more -->
      # archive: true
      # archive_name: Archive
