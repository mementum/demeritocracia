site_name: Demeritocracia
site_url: https://demeritocracia.de
site_description: Deméritos en la democracia española
site_author: Daniel Rodriguez

extra_css:
  - stylesheets/extra.css

theme:
  language: es
  name: material
  # custom_dir: overrides
  # favicon: assets/images/favicon.png
  # logo: assets/images/favicon.png

  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  #  font:
    # text: 'Inter'
    # code: 'Hack'

  features:
    - content.code.copy
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - toc.follow
    - toc.integrate

plugins:
  - privacy
  - blog:
      blog_dir: .
      blog_toc: true
      post_dir: posts
      # post_date_format: medium
      # post_url_format: "{date}/{slug}"
      authors: true
      categories: true
      # categories_allowed:
      #   - General
      #  - Software Engineering
      #  - Data Science
      post_excerpt: required
      post_excerpt_separator: <!-- more -->
      archive: true
      archive_name: Archivo
      archive_toc: true
      archive_date_format: MMMM yyyy
      archive_url_date_format: yyyy/MM
      archive_pagination: false
      pagination: true
      pagination_per_page: 10
      pagination_keep_content: false

  - rss:
      match_path: "posts/.*"
      date_from_meta:
        as_creation: date

  - search
  - social
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true

  - pymdownx.blocks.admonition
  - pymdownx.blocks.html
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.escapeall:
      hardbreak: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Blog: index.md
  - Acerca de: about.md
